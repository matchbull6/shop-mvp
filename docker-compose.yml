services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [frontend, backend, bot]
    restart: unless-stopped

  bot:
    build: ./bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_IDS: ${ADMIN_IDS}

      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      WEBHOOK_HOST: https://${DOMAIN}
      WEBHOOK_PATH: /bot/webhook

      WEBAPP_URL: https://${DOMAIN}
      API_URL: http://backend:8000
      API_KEY: ${API_KEY}
    depends_on: [frontend, backend]
    deploy:
      replicas: 2
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8000
    depends_on: [backend]
    deploy:
      replicas: 2
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      API_KEY: ${API_KEY}
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/shop_mvp
      MINIO_URL: minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: products
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      replicas: 2
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: shop_mvp
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "shop_mvp"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  minio:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    command: server /data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  seed:
    image: python:3.12-slim
    profiles: [tools]
    working_dir: /app
    volumes:
      - ./seed.py:/app/seed.py:ro
    environment:
      API_URL: http://backend:8000
      API_KEY: ${API_KEY}
    command: sh -c "pip install -q httpx faker faker-commerce && python seed.py"
    depends_on: [backend]

volumes:
  caddy-data:
  postgres-data:
  minio-data:
